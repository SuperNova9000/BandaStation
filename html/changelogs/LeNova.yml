author: "LeNova"
delete-after: True
changes:
  - rscadd: "Добавлена установка по продаже электроэнергии Центральному командованию — «Большой фокусирующий лазер» (BFL). Ядро установки отбирает мощность из энергосети в пяти режимах и конвертирует её в кредиты на счёт отдела снабжения, попутно накапливая тепло в ядре."
  - rscadd: "Добавлен порт охлаждения BFL — теплообменник для замкнутого контура. Эффективность отвода тепла зависит от удельной теплоёмкости газа в контуре и его объёма, поэтому для высоких режимов требуется подведение гипер-ноблиума."
